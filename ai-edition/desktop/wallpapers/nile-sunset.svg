<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/><stop offset=".5" stop-color="#c65d3a"/><stop offset="1" stop-color="#f2a65a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a65a"/><stop offset="1" stop-color="#14425e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#sky)"/>
  <circle cx="640" cy="360" r="80" fill="#ffdf8e"/>
  <circle cx="640" cy="360" r="130" fill="#ffdf8e" opacity=".22"/>
  <rect y="430" width="1280" height="370" fill="url(#river)"/>
  <!-- sun reflection -->
  <g stroke="#ffe9a8" stroke-width="6" opacity=".7">
    <line x1="560" y1="470" x2="720" y2="470"/><line x1="580" y1="510" x2="700" y2="510"/>
    <line x1="600" y1="550" x2="680" y2="550"/><line x1="560" y1="600" x2="720" y2="600"/>
  </g>
  <!-- felucca -->
  <g>
    <polygon points="640,430 640,260 780,430" fill="#f5efe0"/>
    <polygon points="640,430 640,300 540,430" fill="#e8dcc0"/>
    <rect x="636" y="250" width="8" height="190" fill="#5a3a1a"/>
    <path d="M520,430 L780,430 L740,470 L560,470 Z" fill="#4a2c12"/>
  </g>
  <!-- palms -->
  <g fill="#123b1e">
    <rect x="120" y="330" width="12" height="110"/><ellipse cx="126" cy="320" rx="80" ry="20"/>
    <rect x="1120" y="350" width="12" height="90"/><ellipse cx="1126" cy="342" rx="70" ry="18"/>
  </g>
  <rect y="700" width="1280" height="100" fill="#0e2f1a"/>
</svg>

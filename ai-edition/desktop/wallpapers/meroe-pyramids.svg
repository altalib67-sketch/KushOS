<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e4a5e"/><stop offset=".55" stop-color="#e8863a"/><stop offset="1" stop-color="#f7b733"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b25a"/><stop offset="1" stop-color="#b97e2e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#sky)"/>
  <circle cx="980" cy="380" r="70" fill="#ffe9a8"/>
  <circle cx="980" cy="380" r="110" fill="#ffe9a8" opacity=".25"/>
  <!-- Meroe pyramids -->
  <g>
    <polygon points="80,560 260,240 440,560" fill="#8a5a28"/>
    <polygon points="260,240 440,560 350,560" fill="#6e451d"/>
    <polygon points="380,560 560,300 740,560" fill="#9c6a32"/>
    <polygon points="560,300 740,560 650,560" fill="#7a4f20"/>
    <polygon points="700,560 860,360 1020,560" fill="#8a5a28"/>
    <polygon points="860,360 1020,560 940,560" fill="#6e451d"/>
    <polygon points="1020,560 1140,420 1260,560" fill="#9c6a32"/>
  </g>
  <!-- dunes -->
  <path d="M0,560 Q320,500 640,560 T1280,560 V800 H0 Z" fill="url(#sand)"/>
  <path d="M0,640 Q400,580 800,640 T1280,620 V800 H0 Z" fill="#a86f24"/>
  <!-- acacia -->
  <g fill="#3d2c12">
    <rect x="150" y="520" width="10" height="90"/>
    <ellipse cx="155" cy="505" rx="90" ry="22"/>
    <ellipse cx="110" cy="520" rx="55" ry="16"/>
  </g>
  <g fill="#3d2c12">
    <rect x="1120" y="540" width="8" height="70"/>
    <ellipse cx="1124" cy="528" rx="70" ry="18"/>
  </g>
